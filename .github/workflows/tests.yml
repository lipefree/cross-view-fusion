name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.4.1"
          - python: "3.12"
            torch: "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyTorch
        run: |
          if [ "${{ matrix.torch }}" = "latest" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          fi
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test and run examples
        run: |
          python -m pytest -q
          python examples/minimal.py
          python examples/multiscale.py
      - name: Build and test installed wheel outside the checkout
        run: |
          python -m build
          python -m pip uninstall -y cross-view-fusion
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import cross_view_fusion; print(cross_view_fusion.__version__)"
          python "$GITHUB_WORKSPACE/examples/minimal.py"
