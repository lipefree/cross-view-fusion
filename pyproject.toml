[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-view-fusion"
version = "0.1.0"
description = "Modular deformable attention and patch fusion for aligned feature maps"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/lipefree/cross-view-fusion"
Paper = "https://arxiv.org/abs/2606.10166"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1", "setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
